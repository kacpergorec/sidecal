# Builds SideCal.app for Apple Silicon and Intel and attaches both to a GitHub release.
# Publish a release: git tag v0.1.0 && git push origin v0.1.0,
# or run this workflow by hand (Actions tab) and enter the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0 (leave empty to only build)"
        required: false

permissions:
  contents: write
  pages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, name: apple-silicon }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, name: intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Stamp the version from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          V="${TAG#v}"
          if echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            perl -0pi -e 's/^version = "[^"]*"/version = "'"$V"'"/m' Cargo.toml
            perl -pi -e 's#(<key>CFBundle(?:Short)?Version(?:String)?</key><string>)[^<]*#${1}'"$V"'#' Info.plist
            perl -pi -e 's/("version":\s*")[^"]*/${1}'"$V"'/' tauri.conf.json
          fi
      - name: Build SideCal.app
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: |
          cargo build --release --target ${{ matrix.target }}
          APP=SideCal.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/sidecal "$APP/Contents/MacOS/"
          cp Info.plist "$APP/Contents/"
          cp icons/icon.icns "$APP/Contents/Resources/"
          codesign --force --sign - "$APP"
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent SideCal.app SideCal-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SideCal-${{ matrix.name }}
          path: SideCal-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Claude Desktop extension: a zip with a launcher that runs the installed SideCal.app (same for both Macs).
      - name: Pack the Claude Desktop extension
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          V="${TAG#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' && sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" mcpb/manifest.json
          (cd mcpb && zip -qr ../dist/SideCal.mcpb manifest.json icon.png server)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SideCal.mcpb
          body: |
            ## Install
            1. Download **SideCal-apple-silicon.zip** (M1 and newer) or **SideCal-intel.zip** (Intel Macs).
            2. Unzip and drag **SideCal.app** to **Applications**.
            3. First launch: right-click the app, choose **Open**, then **Open** again. The app is not notarized with an Apple Developer ID, so macOS asks once.

            If macOS says the app is damaged, run `xattr -dr com.apple.quarantine /Applications/SideCal.app`.

            Use Claude Desktop? Open **SideCal.mcpb** after installing the app to let Claude read and time-block your calendar.

            Already installed? Use **Check for Updates…** in the SideCal menu bar menu.
      # SideCal's optional update check reads docs/latest.json from GitHub Pages.
      - name: Publish latest.json
        continue-on-error: true
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || exit 0
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          cat > docs/latest.json <<EOF
          {
            "version": "$V",
            "assets": {
              "aarch64": { "url": "$BASE/SideCal-apple-silicon.zip", "sha256": "$(sha256sum dist/SideCal-apple-silicon.zip | cut -d' ' -f1)" },
              "x86_64": { "url": "$BASE/SideCal-intel.zip", "sha256": "$(sha256sum dist/SideCal-intel.zip | cut -d' ' -f1)" }
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git commit -m "latest.json for $TAG" || exit 0
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
