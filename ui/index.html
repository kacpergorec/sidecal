<!doctype html>
<html class="boot">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  :root { --hour: 40px; --gutter: 22px; }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  #backdrop { position: absolute; inset: 0; z-index: 15; background: var(--scrim); }
  #sel { position: absolute; left: 1px; right: 2px; z-index: 4; border-radius: 6px; pointer-events: none;
    background: color-mix(in srgb, var(--focus) 22%, transparent); border: 1px solid var(--focus);
    color: var(--text); padding: 2px 6px; font: 500 10.5px var(--font); }
  #day { cursor: crosshair; }

  html, body { height: 100%; color: var(--text); overflow: hidden;
    font: 12px/1.4 var(--font); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  /* Fixed-width content anchored to the screen edge: the window only reveals it, so nothing reflows while it slides. */
  /* Not plain `transparent`: then the body background would be propagated to the whole canvas and fill the
     island margin / edge strip with an opaque colour. 0.5% alpha is invisible but stops the propagation. */
  html { background: rgba(0, 0, 0, .005); }
  body { height: auto; background: var(--bg); display: flex; flex-direction: column; border-left: 1px solid var(--line); border-right: 1px solid transparent;
    position: absolute; top: var(--pad, 0px); bottom: var(--pad, 0px); right: var(--pad, 0px); left: auto;
    width: var(--w, 190px); min-width: var(--w, 190px); }
  :root[data-side="left"] body { right: auto; left: var(--pad, 0px); border-left-color: transparent; border-right-color: var(--line); }
  /* Island mode: a floating, fully bordered card with macOS-like rounded corners and a transparent margin. */
  :root[data-island] body { border-color: var(--line); border-radius: var(--r, 12px); }
  /* Slide mode: the window keeps its full width and slides; the body shrinks towards the visible sliver. */
  :root[data-slide] body { right: auto; left: var(--pad, 0px); }

  /* ---- auto-hidden strip: the same elements, transitioned (no swap), in step with the window slide ---- */
  body.collapsed, :root[data-side] body.collapsed, :root[data-island] body.collapsed {
    background: transparent; border-color: transparent !important; border-radius: 0; top: 0; bottom: 0; right: 0; }
  :root[data-side="left"] body.collapsed { right: auto; left: 0; }
  body.collapsed { width: 100%; min-width: 0; }
  :root[data-slide] body.collapsed { width: var(--strip, 10px); min-width: var(--strip, 10px); left: 0; right: auto; }
  :root[data-slide][data-side="left"] body.collapsed { left: calc(var(--ww, 190px) - var(--strip, 10px)); }
  body.collapsed header, body.collapsed #allday, body.collapsed .hour { opacity: 0; pointer-events: none; }
  body.collapsed #msg { display: none; }
  body.collapsed #day { margin-left: 0; }
  body.collapsed .ev .tm, body.collapsed .ev .tt { display: none; }
  body.collapsed .ev { font-size: 0 !important; padding: 0; border-radius: 2px; left: 1px !important; width: calc(100% - 2px) !important; opacity: var(--pv-op, .6); box-shadow: none; }
  body.collapsed .ev.past { opacity: calc(var(--pv-op, .6) * .5); }
  body.collapsed .ev.active { opacity: 1; }   /* the running event stays at full strength in the preview */
  body.collapsed #now { left: 0; }
  /* Hovering the strip: preview bars fade out in 0.1 s while the sidebar is about to open. */
  body.collapsed.hover .ev, body.collapsed.hover .ev.past, body.collapsed.hover .ev.active, body.collapsed.hover #now { opacity: 0; transition: opacity .1s linear; }
  /* Transitions live on the collapsed state only: collapsing animates, expanding is instant. */
  body.collapsed { transition: width .16s ease-out, min-width .16s ease-out, left .16s ease-out, right .16s ease-out, top .16s ease-out,
    bottom .16s ease-out, border-radius .16s ease-out, background-color .16s, border-color .16s; }
  body.collapsed header, body.collapsed #allday, body.collapsed .hour, body.collapsed #day, body.collapsed .ev {
    transition: opacity .16s ease-out, margin .16s ease-out, left .16s ease-out, width .16s ease-out,
    padding .16s ease-out, border-radius .16s; }

  /* ---- header ---- */
  /* min-height: the buttons are absolutely positioned, so without weekday/date the header would collapse. */
  header { text-align: center; padding: 10px 40px 9px; border-bottom: 1px solid var(--line); position: relative; min-height: 40px; }
  header b, header span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header b { font: 500 16px/1.15 var(--serif); letter-spacing: -.02em; }
  header span { margin-top: 2px; color: var(--muted); font-size: 10.5px; letter-spacing: .01em; }
  header .tools { position: absolute; left: 5px; top: 7px; display: flex; flex-direction: column; gap: 2px; }
  header .tools.r { left: auto; right: 5px; }
  header button { width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer; transition: background-color .12s, color .12s, transform .12s; }
  header button:hover { background: var(--hover); color: var(--text); }
  header button:active { transform: scale(.94); }
  header svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* ---- timeline ---- */
  #allday { padding: 4px 4px 0 var(--gutter); }
  #allday div { border-radius: 6px; padding: 2px 6px; margin-bottom: 2px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #scroll { flex: 1; overflow: hidden; min-height: 0; }
  #day { position: relative; height: 100%; margin-left: var(--gutter); }
  .hour { position: absolute; left: calc(var(--gutter) * -1); right: 0; border-top: 1px solid var(--line); pointer-events: none; }
  .hour span { position: absolute; left: 0; width: calc(var(--gutter) - 5px); text-align: right; top: -6px;
    background: var(--bg); color: var(--muted); font: 500 9px/12px var(--font); letter-spacing: 0; }
  .ev { position: absolute; border-radius: 6px; padding: 0 6px; overflow: hidden; font-weight: 500; line-height: 1.2;
    font-size: var(--ev-fs, 11px); display: flex; align-items: center; gap: 6px; }
  .ev .tt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .tm { flex: none; font-size: .88em; opacity: .78; white-space: nowrap; }
  /* Tiers by rendered height: l2 = title + time on two lines, l1 = one line (time beside the title),
     l0 = compact title only, mini = too small for text (name stays in the tooltip). */
  .ev.l2 { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 1px; padding-top: 4px; }
  .ev.l2 .tt { flex: 0 1 auto; width: 100%; }
  .ev.l2.tall .tt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ev.l0 { font-size: calc(var(--ev-fs, 11px) - 1px); }
  .ev.mini { font-size: 0; padding: 0; }
  .ev.active { z-index: 7; box-shadow: 0 0 0 1px var(--bg), 0 0 0 2.5px var(--ev-c), 0 0 8px 1px color-mix(in srgb, var(--ev-c) 45%, transparent); }
  .ev.editable { cursor: grab; }
  .ev.dragging { z-index: 8; cursor: grabbing; outline: 2px solid var(--text); outline-offset: -1px; }
  #tip { position: absolute; z-index: 12; left: 2px; padding: 2px 7px; border-radius: 6px; background: var(--panel);
    border: 1px solid var(--line); color: var(--text); font: 500 10.5px var(--font); font-variant-numeric: tabular-nums;
    pointer-events: none; white-space: nowrap; }
  #now { position: absolute; left: calc(var(--gutter) * -1); right: 0; height: 1.5px; background: var(--now); z-index: 10; pointer-events: none; }
  #now::before { content: ""; position: absolute; left: 0; top: -2.5px; width: 6.5px; height: 6.5px; border-radius: 50%; background: var(--now); }
  #msg { padding: 16px 12px; color: var(--muted); text-align: center; line-height: 1.5; font-size: 11px; }

  /* ---- color menu & event form: flat panels, hairline borders ---- */
  #cmenu { position: absolute; z-index: 30; padding: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; display: grid; grid-template-columns: repeat(6, 18px); gap: 8px; }
  #cmenu .sw { width: 18px; height: 18px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    outline: 1px solid color-mix(in srgb, var(--text) 14%, transparent); outline-offset: 0; transition: transform .12s; }
  #cmenu .sw:hover { transform: scale(1.18); }
  #cmenu.list { grid-template-columns: 1fr; gap: 2px; padding: 6px; min-width: 150px; }
  #cmenu .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 4px -4px 2px; }
  #cmenu .act { grid-column: 1 / -1; text-align: left; padding: 6px 8px; border: 0; border-radius: 6px; background: none;
    color: var(--text); font: 500 12px var(--font); cursor: pointer; }
  #cmenu .act:hover { background: var(--hover); }
  #cmenu .act.danger { color: var(--danger); }
  .is-hidden { opacity: .45; outline: 1px dashed var(--muted); outline-offset: -1px; }
  #cmenu button.reset { grid-column: 1 / -1; font: 500 11px var(--font); color: var(--muted); background: none; border: 0;
    border-top: 1px solid var(--line); padding: 8px 0 0; margin-top: 2px; cursor: pointer; text-align: center; }
  #cmenu button.reset:hover { color: var(--text); }

  #form { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 20; padding: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; gap: 8px; user-select: text; }
  #form input, #form select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  #form input:focus, #form select:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
  #form input[type=time] { font-size: 12px; }
  #form .row { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  #form .row input { min-width: 0; }
  #form button { flex: 1; padding: 6px 0; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: 500 12px var(--font); cursor: pointer; transition: background-color .12s, transform .12s; }
  #form button:hover { background: var(--hover); }
  #form button:active { transform: scale(.98); }
  #form button.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  #form button.primary:hover { opacity: .88; }
  #form button.danger { color: var(--danger); border-color: transparent; }
  #err { color: var(--danger); font-size: 11px; }
  #form { max-height: calc(100% - 16px); overflow-y: auto; }
  /* Narrow sidebars: stack the time fields, tighten paddings so nothing is cut off. */
  @media (max-width: 220px) {
    #form { left: 6px; right: 6px; bottom: 6px; padding: 8px; gap: 6px; }
    #form .row.times { flex-direction: column; align-items: stretch; gap: 4px; }
    #form .row.times .dash { display: none; }
    #form input, #form select { padding: 5px 6px; }
    header { padding-left: 34px; padding-right: 34px; }
    .ev { padding: 0 4px; gap: 4px; }
    .ev.l2 { padding-top: 3px; }
  }
  html.boot * { transition: none !important; }
</style>
</head>
<body>
<header>
  <div class="tools">
    <button id="gear" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16"><path d="M2 4h6.5M11.9 4H14M2 8h2.5M7.9 8H14M2 12h7.5M12.9 12H14"/><circle cx="10.2" cy="4" r="1.7"/><circle cx="6.2" cy="8" r="1.7"/><circle cx="11.2" cy="12" r="1.7"/></svg></button>
  </div>
  <b id="weekday"></b><span id="date"></span>
  <div class="tools r"><button id="add" title="New event" aria-label="New event"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button></div>
</header>
<div id="msg" hidden>Waiting for calendar access…<br>System Settings → Privacy &amp; Security → Calendars</div>
<div id="allday"></div>
<div id="scroll"><div id="day"><div id="now"></div><div id="sel" hidden></div></div></div>

<div id="backdrop" hidden></div>
<div id="cmenu" hidden></div>
<form id="form" hidden>
  <input id="f-title" placeholder="Event title" autocomplete="off" required>
  <select id="f-cal"></select>
  <div class="row times"><input id="f-start" type="time" required><span class="dash">–</span><input id="f-end" type="time" required></div>
  <div id="err"></div>
  <div class="row"><button type="button" id="f-cancel">Cancel</button><button class="primary">Save</button></div>
</form>

<script src="palette.js"></script>
<script>
// Initial state arrives synchronously from Rust, so the first paint is already correct.
const SC = window.__SC || {};
if (SC.slide) document.documentElement.dataset.slide = '';
if (SC.collapsed) document.body.classList.add('collapsed');
requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('boot')));
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const $ = (id) => document.getElementById(id);
let HOUR = 40, MIN = HOUR / 60;  // fitted to the window height so all 24 h are always visible
let events = [], calendars = [], cfg = {}, dayStart = 0, scrolled = false, editing = null;

for (let h = 0; h < 24; h++) {
  const el = document.createElement('div');
  el.className = 'hour';
  el.dataset.h = h;
  $('day').appendChild(el);
}

// Fit exactly 24 hours into the available height; no scrolling.
function fit() {
  const h = $('scroll').clientHeight;
  if (!h) return;
  HOUR = h / 24; MIN = HOUR / 60;
  document.querySelectorAll('.hour').forEach((el) => (el.style.top = el.dataset.h * HOUR + 'px'));
  // Small screens get tighter rows: scale entry text with the hour height (9.5-12 px).
  document.documentElement.style.setProperty('--ev-fs', Math.max(9.5, Math.min(12, HOUR * 0.27)) + 'px');
}

// One place builds an entry's geometry and content, used by render() and while dragging.
function styleEv(el, e, start, end) {
  const top = Math.max(0, (start - dayStart) / 60000) * MIN;
  const bottom = Math.min(24 * 60, (end - dayStart) / 60000) * MIN;
  const h = Math.max(16, bottom - top - 1);
  el.style.top = top + 'px';
  el.style.height = h + 'px';
  el.classList.remove('l2', 'l1', 'l0', 'mini', 'tall');
  const tier = h >= 40 ? 'l2' : 'l1';
  el.classList.add(tier);
  if (h >= 60) el.classList.add('tall');
  el.textContent = '';
  const tt = document.createElement('span');
  tt.className = 'tt'; tt.textContent = e.title;
  el.appendChild(tt);
  // Inline time only in a full-width column (side-by-side entries are too narrow for it).
  if (tier === 'l2' || (e.cols || 1) === 1) {
    const tm = document.createElement('span');
    tm.className = 'tm'; tm.textContent = `${hm(start)}–${hm(end)}`;
    el.appendChild(tm);
  }
  el.title = `${e.title} · ${e.calendar} · ${hm(start)}–${hm(end)}`;
}
function showTip(el, start, end) {
  let tip = $('tip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'tip'; $('day').appendChild(tip); }
  tip.hidden = false;
  tip.textContent = `${hm(start)}–${hm(end)}`;
  const top = parseFloat(el.style.top), h = parseFloat(el.style.height);
  tip.style.top = (top >= 24 ? top - 23 : top + h + 4) + 'px';
}

const pad = (n) => String(n).padStart(2, '0');
const hm24 = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// Display format honours "Use 12-Hour Time Format"; inputs of type=time always need hm24.
const hm = (ms) => {
  if (!cfg.use_12_hour) return hm24(ms);
  const d = new Date(ms);
  return `${d.getHours() % 12 || 12}:${pad(d.getMinutes())}`;   // 12-hour clock, no AM/PM
};
const atTime = (str) => { const [h, m] = str.split(':').map(Number); const d = new Date(dayStart); d.setHours(h, m, 0, 0); return d.getTime(); };
function hourLabel(h) {
  return cfg.use_12_hour ? h % 12 || 12 : h;
}
function fmtLeft(ms) {
  const m = Math.max(1, Math.round(ms / 60000));
  return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
}

function applyTheme() {
  const root = document.documentElement;
  if (cfg.theme === 'light' || cfg.theme === 'dark') root.dataset.theme = cfg.theme; else delete root.dataset.theme;
  root.style.setProperty('--w', cfg.width + 'px');
  const pad = cfg.island_mode ? 8 : 0;
  root.style.setProperty('--pad', pad + 'px');
  root.style.setProperty('--ww', cfg.width + 2 * pad + 'px');
  if (cfg.island_mode) root.dataset.island = ''; else delete root.dataset.island;
  $('weekday').hidden = !cfg.show_weekday;
  root.style.setProperty('--strip', cfg.strip_width + 'px');
  root.style.setProperty('--pv-op', cfg.preview_opacity);
  $('date').hidden = !cfg.show_date;
  root.dataset.side = cfg.side;
  document.querySelectorAll('.hour').forEach((el) => (el.innerHTML = `<span>${hourLabel(+el.dataset.h)}</span>`));
  $('now').hidden = !cfg.show_time_indicator;
}

// Lay overlapping events side by side in columns.
// Calendar priority = its position in Settings → Calendars (lower index wins).
const rank = (e) => { const i = cfg.calendars.findIndex((c) => c.id === e.calendar_id); return i < 0 ? 1e6 : i; };

function layout(list) {
  const cols = [];
  list.sort((a, b) => a.start - b.start || rank(a) - rank(b) || b.end - a.end);
  for (const e of list) {
    let i = cols.findIndex((end) => end <= e.start);
    if (i < 0) { i = cols.length; cols.push(0); }
    cols[i] = e.end;
    e.col = i;
  }
  for (const e of list) {
    e.cols = 1 + Math.max(...list.filter((o) => o.start < e.end && o.end > e.start).map((o) => o.col));
  }
}

// ---- custom colors, drag to move, drag edges to resize ---------------------------

// Black or white text, whichever reads better on the entry colour (WCAG relative luminance).
function ink(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#fff';
  const [r, g, b] = [0, 2, 4].map((i) => {
    const c = parseInt(m[1].slice(i, i + 2), 16) / 255;
    return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
  });
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return 1.05 / (L + 0.05) >= (L + 0.05) / 0.05 ? '#ffffff' : '#111111';
}
const darkMq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => scIsDark(cfg.theme);
const tone = (p) => scTone(p, cfg.theme);
// A calendar can override its colour in Settings → Calendars; otherwise its own colour, livened up.
const calPref = (e) => (cfg.calendars || []).find((c) => c.id === e.calendar_id) || {};
function defaultColor(e) {
  const p = PALETTE.find((x) => x.id === calPref(e).color);
  return p ? tone(p) : scSoften(e.color, cfg.theme);
}
function colorOf(e) {
  const custom = (cfg.event_colors || {})[e.id];
  const p = PALETTE.find((x) => x.id === custom);
  if (p) return tone(p);
  return /^#/.test(custom || '') ? custom : defaultColor(e);
}
darkMq.addEventListener('change', () => render());

function closeColorMenu() {
  if ($('cmenu').hidden) return;
  $('cmenu').hidden = true;
  if ($('form').hidden) invoke('set_pinned', { pinned: false });
}

// Right-click menu; hovering a swatch previews the colour on the entry itself.
let showHidden = false;                       // "Show hidden events" view, per session
const isHiddenEv = (e) => (cfg.hidden_events || []).includes(e.id);

function addAction(menu, label, fn, danger) {
  const b = document.createElement('button');
  b.className = 'act' + (danger ? ' danger' : '');
  b.textContent = label;
  b.onclick = fn;
  menu.appendChild(b);
}
function showMenu(menu, m) {
  menu.hidden = false;
  invoke('set_pinned', { pinned: true });
  menu.style.left = Math.max(6, Math.min(innerWidth - menu.offsetWidth - 6, m.clientX - menu.offsetWidth / 2)) + 'px';
  menu.style.top = Math.max(6, Math.min(innerHeight - menu.offsetHeight - 6, m.clientY + 10)) + 'px';
}

// Right-click on the empty board.
function openBoardMenu(m) {
  if (document.body.classList.contains('collapsed')) return;
  const menu = $('cmenu');
  menu.innerHTML = '';
  menu.classList.add('list');
  menu.style.gridTemplateColumns = '';
  addAction(menu, 'Reload', async () => { closeColorMenu(); calendars = []; await loadConfig(); refresh(); });
  const n = (cfg.hidden_events || []).length;
  addAction(menu, (showHidden ? 'Hide' : 'Show') + ' hidden events' + (n ? ` (${n})` : ''),
    () => { showHidden = !showHidden; closeColorMenu(); render(); });
  addAction(menu, 'Settings…', () => { closeColorMenu(); invoke('open_settings'); });
  showMenu(menu, m);
}
document.addEventListener('contextmenu', (m) => {
  m.preventDefault();                           // no WebKit menu (Reload / Inspect) anywhere
  if (!m.target.closest('.ev, #cmenu, #form, #allday > div')) openBoardMenu(m);
});

// Right-click on an entry: colour, hide, delete. Hovering a swatch previews the colour on the entry.
function openColorMenu(m, e, el) {
  if (document.body.classList.contains('collapsed')) return;
  const current = colorOf(e);
  const menu = $('cmenu');
  menu.classList.remove('list');
  const preview = (c) => { el.style.background = c; el.style.color = ink(c); };
  const commit = (id) => { invoke('set_event_color', { id: e.id, color: id }); closeColorMenu(); };
  menu.innerHTML = '';
  for (const p of PALETTE) {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = tone(p); b.title = p.id;
    b.onmouseenter = () => preview(tone(p));
    b.onmouseleave = () => preview(current);
    b.onclick = () => commit(p.id);
    menu.appendChild(b);
  }
  const reset = document.createElement('button');
  reset.className = 'reset';
  reset.textContent = 'Use calendar colour';
  reset.onmouseenter = () => preview(defaultColor(e));
  reset.onmouseleave = () => preview(current);
  reset.onclick = () => commit(null);
  menu.appendChild(reset);

  const sep = document.createElement('div');
  sep.className = 'sep';
  menu.appendChild(sep);
  addAction(menu, isHiddenEv(e) ? 'Unhide event' : 'Hide event',
    () => { invoke('set_event_hidden', { id: e.id, hidden: !isHiddenEv(e) }); closeColorMenu(); });
  if (e.editable) {
    // Two clicks: deleting removes the event from the calendar itself.
    addAction(menu, 'Delete event', function () {
      if (!this.dataset.sure) { this.dataset.sure = '1'; this.textContent = 'Click again to delete'; return; }
      invoke('delete_event', { id: e.id }).then(() => { closeColorMenu(); refresh(); }).catch((err) => console.error(err));
    }, true);
  }

  // As many swatch columns as fit the sidebar (6, 4, 3 or 2), so the menu is never cut off.
  const fit = Math.floor((innerWidth - 12 - 20 + 8) / 26);
  const cols = [6, 4, 3, 2].find((n) => n <= fit) || 2;
  menu.style.gridTemplateColumns = `repeat(${cols}, 18px)`;
  showMenu(menu, m);
}
document.addEventListener('mousedown', (ev) => { if (!$('cmenu').hidden && !$('cmenu').contains(ev.target)) closeColorMenu(); }, true);

// Grab the top/bottom edge to resize, the body to move. Snaps to 15 min; a plain click opens the form.
let evDrag = null;
function edgeMode(m, el) {
  const r = el.getBoundingClientRect(), y = m.clientY - r.top, edge = r.height > 28 ? 5 : 4;
  return y < edge && r.height > 28 ? 'top' : y > r.height - edge ? 'bottom' : 'move';
}
function startEvDrag(m, e, el) {
  m.preventDefault(); m.stopPropagation();
  evDrag = { e, el, mode: edgeMode(m, el), y0: m.clientY, ns: e.start, ne: e.end, moved: false };
}
window.addEventListener('mousemove', (m) => {
  if (!evDrag) return;
  const d = evDrag, dy = m.clientY - d.y0;
  if (!d.moved && Math.abs(dy) < 3) return;
  d.moved = true; d.el.classList.add('dragging');
  const step = Math.round(dy / MIN / 15) * 15 * 60000, dayEnd = dayStart + 864e5, min15 = 15 * 60000;
  let { start, end } = d.e;
  if (d.mode === 'move') {
    const len = end - start;
    start = Math.max(dayStart, Math.min(dayEnd - len, start + step)); end = start + len;
  } else if (d.mode === 'top') {
    start = Math.max(dayStart, Math.min(end - min15, start + step));
  } else {
    end = Math.min(dayEnd, Math.max(start + min15, end + step));
  }
  d.ns = start; d.ne = end;
  styleEv(d.el, d.e, start, end);
  showTip(d.el, start, end);
});
window.addEventListener('mouseup', async () => {
  if (!evDrag) return;
  const d = evDrag; evDrag = null;
  d.el.classList.remove('dragging');
  if ($('tip')) $('tip').hidden = true;
  if (!d.moved) { openForm(d.e); return; }
  try {
    await invoke('save_event', { event: { id: d.e.id, title: d.e.title, calendar_id: d.e.calendar_id, start: d.ns, end: d.ne } });
  } catch (err) { console.error(err); }
  refresh();
});

function render() {
  fit();
  const now = Date.now();
  document.querySelectorAll('.ev').forEach((el) => el.remove());
  $('allday').innerHTML = '';

  const shown = events.filter((e) => (cfg.calendars.find((c) => c.id === e.calendar_id) || {}).visible !== false
    && (showHidden || !isHiddenEv(e)));
  const timed = shown.filter((e) => !e.all_day);
  layout(timed);
  if (cfg.display_all_day_events) {
    for (const e of shown.filter((e) => e.all_day).sort((a, b) => rank(a) - rank(b))) {
      const el = document.createElement('div');
      el.style.background = colorOf(e);
      el.style.color = ink(colorOf(e));
      el.textContent = e.title;
      if (isHiddenEv(e)) el.classList.add('is-hidden');
      el.oncontextmenu = (m) => { m.preventDefault(); openColorMenu(m, e, el); };
      $('allday').appendChild(el);
    }
  }
  for (const e of [...timed].sort((a, b) => rank(b) - rank(a))) {
    const el = document.createElement('div');
    el.className = 'ev' + (e.editable ? ' editable' : '');
    el.style.cssText = `left:calc(${(e.col / e.cols) * 100}% + 3px);width:calc(${100 / e.cols}% - 6px);` +
      `background:${colorOf(e)};color:${ink(colorOf(e))}`;
    styleEv(el, e, e.start, e.end);
    if (isHiddenEv(e)) el.classList.add('is-hidden');
    if (cfg.show_glowing_border && e.start <= now && e.end > now) {
      el.classList.add('active');
      el.style.setProperty('--ev-c', colorOf(e));
    }
    el.oncontextmenu = (m) => { m.preventDefault(); openColorMenu(m, e, el); };
    if (e.editable) {
      el.onmousedown = (m) => { if (m.button === 0 && !document.body.classList.contains('collapsed')) startEvDrag(m, e, el); };
      el.onmousemove = (m) => { if (!evDrag) el.style.cursor = edgeMode(m, el) === 'move' ? 'grab' : 'ns-resize'; };
    }
    $('day').appendChild(el);
  }

  const nowY = ((now - dayStart) / 60000) * MIN;
  $('now').style.top = nowY + 'px';

  // Menu bar: current event with time left, else the next one.
  const cur = timed.find((e) => e.start <= now && e.end > now);
  const next = timed.find((e) => e.start > now);
  let title = 'Calendar';
  if (cur) {
    const left = cfg.show_duration_in_menu_bar ? `${fmtLeft(cur.end - now)} left` : '';
    title = cfg.show_title_in_menu_bar ? (left ? `${cur.title} (${left})` : cur.title) : (left || 'Calendar');
  } else if (next) {
    const inn = cfg.show_duration_in_menu_bar ? `in ${fmtLeft(next.start - now)}` : '';
    title = cfg.show_title_in_menu_bar ? `${next.title} ${inn}`.trim() : (inn ? `Next ${inn}` : 'Calendar');
  } else if (cfg.show_title_in_menu_bar) {
    title = 'No more events';
  }
  invoke('set_title', { title });

}

// ---- add / edit -----------------------------------------------------------

function nextFreeSlot() {
  const busy = events.filter((e) => !e.all_day);
  let t = Math.ceil(Date.now() / 1800000) * 1800000;
  while (busy.some((e) => e.start < t + 3600000 && e.end > t)) t += 1800000;
  return t;
}

// Centers the modal on the entry (or the window when there is none), kept fully on screen.
function placeForm(startMs, endMs, anchored) {
  const f = $('form'), margin = 6;
  const h = f.offsetHeight;
  let top = (innerHeight - h) / 2;
  if (anchored) {
    const dayTop = $('day').getBoundingClientRect().top;
    const mid = dayTop + (((startMs + endMs) / 2 - dayStart) / 60000) * MIN;
    top = mid - h / 2;
  }
  f.style.bottom = 'auto';
  f.style.top = Math.max(margin, Math.min(innerHeight - h - margin, top)) + 'px';
}

function openForm(ev, startMs, endMs) {
  editing = ev && ev.id ? ev : null;
  // Priority = order in Settings → Calendars: top one is listed first and preselected.
  // Hidden calendars are left out (except the one the edited event already belongs to).
  const idx = (c) => { const i = cfg.calendars.findIndex((p) => p.id === c.id); return i < 0 ? 1e6 : i; };
  const hiddenCal = (c) => (cfg.calendars.find((p) => p.id === c.id) || {}).visible === false;
  const writable = calendars
    .filter((c) => c.writable && (!hiddenCal(c) || (ev && ev.calendar_id === c.id)))
    .sort((a, b) => idx(a) - idx(b));
  $('f-cal').innerHTML = writable.map((c) => `<option value="${c.id}">${c.title}</option>`).join('');
  const start = ev ? ev.start : startMs ?? (cfg.suggest_events ? nextFreeSlot() : Math.ceil(Date.now() / 900000) * 900000);
  $('f-title').value = ev ? ev.title : '';
  $('f-start').value = hm24(start);
  $('f-end').value = hm24(ev ? ev.end : endMs ?? start + 3600000);
  if (ev) $('f-cal').value = ev.calendar_id;
  $('err').textContent = '';
  $('form').hidden = false;
  $('backdrop').hidden = false;
  placeForm(start, ev ? ev.end : endMs ?? start + 3600000, !!(ev || startMs));
  invoke('set_pinned', { pinned: true });
  setTimeout(() => $('f-title').focus(), 50);
}

function closeForm() {
  $('form').hidden = true;
  $('backdrop').hidden = true;
  $('sel').hidden = true;
  invoke('set_pinned', { pinned: false });
}

$('add').onclick = () => openForm(null);
$('gear').onclick = () => invoke('open_settings');
$('f-cancel').onclick = closeForm;
$('backdrop').onclick = closeForm;

// Click and drag on the timeline to create an event, then confirm in the modal.
const SNAP = 15; // minutes
const minuteAt = (e) => {
  const y = e.clientY - $('day').getBoundingClientRect().top;
  return Math.max(0, Math.min(24 * 60, Math.round(y / MIN / SNAP) * SNAP));
};
let drag = null;
$('day').onmousedown = (e) => {
  if (e.button !== 0 || e.target.closest('.ev') || !$('form').hidden) return;
  drag = { from: minuteAt(e), to: minuteAt(e), moved: false };
};
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  drag.to = minuteAt(e);
  if (drag.to !== drag.from) drag.moved = true;
  if (!drag.moved) return;
  const a = Math.min(drag.from, drag.to), b = Math.max(drag.from, drag.to);
  const sel = $('sel');
  sel.hidden = false;
  sel.style.top = a * MIN + 'px';
  sel.style.height = Math.max(8, (b - a) * MIN) + 'px';
  sel.textContent = `${hm(dayStart + a * 60000)} – ${hm(dayStart + b * 60000)}`;
});
window.addEventListener('mouseup', () => {
  if (!drag) return;
  const { from, to, moved } = drag;
  drag = null;
  const a = Math.min(from, to), b = Math.max(from, to);
  const start = dayStart + a * 60000;
  openForm(null, start, moved ? dayStart + b * 60000 : start + 3600000);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeColorMenu(); closeForm(); } });

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const start = atTime($('f-start').value), end = atTime($('f-end').value);
  if (end <= start) { $('err').textContent = 'End must be after start'; return; }
  try {
    await invoke('save_event', { event: {
      id: editing ? editing.id : null, title: $('f-title').value.trim() || 'Untitled',
      calendar_id: $('f-cal').value || null, start, end } });
    closeForm();
    refresh();
  } catch (err) { $('err').textContent = String(err); }
};

// ---- data -----------------------------------------------------------------

async function loadConfig() {
  cfg = await invoke('get_settings');
  applyTheme();
  render();
}

async function refresh() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (d.getTime() !== dayStart) scrolled = false;
  dayStart = d.getTime();
  $('weekday').textContent = d.toLocaleDateString(undefined, { weekday: 'long' });
  $('date').textContent = d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

  const ok = await invoke('has_access');
  $('msg').hidden = ok;
  if (ok) {
    events = await invoke('get_events', { start: dayStart, end: dayStart + 864e5 });
    if (!calendars.length) calendars = await invoke('get_calendars');
  }
  render();
}

function setCollapsed(on) {
  document.body.classList.remove('hover');
  document.body.classList.toggle('collapsed', on);
  if (on) closeForm();
  render();
}
new ResizeObserver(() => render()).observe($('scroll'));
document.addEventListener('mouseover', () => { if (document.body.classList.contains('collapsed')) document.body.classList.add('hover'); });
document.documentElement.addEventListener('mouseleave', () => document.body.classList.remove('hover'));
listen('collapsed', (e) => setCollapsed(e.payload));
listen('settings-changed', () => { calendars = []; loadConfig().then(refresh); });
listen('new-event', () => openForm(null));
loadConfig().then(refresh);
invoke('slide_mode_enabled').then((on) => { if (on) document.documentElement.dataset.slide = ''; });
invoke('is_collapsed').then(setCollapsed);

// Until calendar access is granted, check every second; afterwards every 30 s.
let lastRefresh = 0, haveAccess = false;
setInterval(async () => {
  const due = Date.now() - lastRefresh > (haveAccess ? 30000 : 1000);
  if (!due) return;
  lastRefresh = Date.now();
  if (evDrag || !$('cmenu').hidden) return;
  if ($('form').hidden) await refresh(); else render();
  haveAccess = $('msg').hidden;
}, 1000);
</script>
</body>
